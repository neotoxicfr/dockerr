version: "2"

# misspell is off: UI strings are French.

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - bodyclose
    - noctx
    - unconvert
    - errorlint
    - copyloopvar
    - usestdlibvars
    - nilerr
    - wastedassign
    - durationcheck

  settings:
    errcheck:
      exclude-functions:
        # defer Close is idiomatic; nothing useful to do on error
        - (*os.File).Close
        - (io.ReadCloser).Close
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*github.com/neotoxicfr/dockerr/internal/store.Store).Close
        # bufio.Writer errors are sticky and returned by Flush, which is checked
        - (*bufio.Writer).WriteString
        - (*bufio.Writer).WriteByte

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - noctx
          - bodyclose
