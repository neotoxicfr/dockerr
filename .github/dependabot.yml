version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    # One pull request for the routine bumps; a major version gets its own.
    groups:
      go-modules:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"

  # Sources of the vendored CodeMirror and xterm bundles: after a bump, run
  # tools/vendor/build.sh and commit web/static/vendor.
  - package-ecosystem: "npm"
    directory: "/tools/vendor"
    target-branch: "dev"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore(deps)"
    groups:
      vendor-bundles:
        patterns:
          - "*"
