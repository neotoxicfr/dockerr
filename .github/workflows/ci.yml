name: CI

# Pull requests run it here; pushes to dev and release tags run it through
# docker-publish.yml, which publishes nothing unless it passes. No path
# filter: its jobs are required checks on dev, a skipped run would block
# the pull request. workflow_dispatch: a pull request moved to dev by the
# auto-merge workflow gets its checks that way.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# Cancel superseded runs on the same ref (saves CI minutes on rapid pushes)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race -timeout 120s ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      # Pinned rather than via golang/govulncheck-action, which installs
      # govulncheck@latest on every run.
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...

  vendor:
    name: Vendored bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # web/static/vendor is built from tools/vendor: a dependency bump that is
    # not followed by tools/vendor/build.sh would ship the old bundle.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rebuild and compare
        run: |
          tools/vendor/build.sh
          git diff --stat --exit-code web/static/vendor

  security-scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln,secret,misconfig"
          format: "table"
          severity: "CRITICAL,HIGH"
          # A vulnerability with no fixed version yet cannot be acted on; it
          # must not hold back every image until upstream ships one.
          ignore-unfixed: true
          exit-code: "1"

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
