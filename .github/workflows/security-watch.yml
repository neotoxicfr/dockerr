name: Vulnerability watch

# Daily govulncheck and Trivy on dev. Findings go to a single open issue,
# updated in place, instead of a failing run (one email a day); it is closed
# once dev is clean.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TITLE: Vulnérabilité à corriger
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./... > govulncheck.txt || echo found >> findings

      - name: Trivy (dev image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:dev
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          output: trivy.txt
          exit-code: "0"

      - name: Open, update or close the issue
        run: |
          grep -q 'Total: [1-9]' trivy.txt && echo found >> findings
          n=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -f findings ]; then
            { echo "Contrôle du $(date -u +%F) sur dev ($(git rev-parse --short HEAD))."
              echo; echo '```'; cat govulncheck.txt trivy.txt; echo '```'; } | head -c 60000 > body.md
            if [ -n "$n" ]; then gh issue edit "$n" --body-file body.md
            else gh issue create --title "$TITLE" --body-file body.md; fi
          elif [ -n "$n" ]; then
            gh issue close "$n" --comment "Corrigé sur dev ($(git rev-parse --short HEAD))."
          fi
