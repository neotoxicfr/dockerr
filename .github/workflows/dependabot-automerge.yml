name: Auto-merge

# Pull requests to dev merge by themselves once every required check
# passes, whatever the kind of update:
# - Dependabot ones on the checks alone (CodeRabbit ignores them);
# - the maintainer's ones only after CodeRabbit has really reviewed the
#   head commit. After a skipped, rate-limited or failed review the pull
#   request stays open, with one comment, until someone asks again.
# A failing check leaves the pull request open.
#
# Dependabot security updates always target main: they are moved to dev,
# never merged into main.
#
# A merge made with GITHUB_TOKEN starts no push workflow, so the job waits
# for the merge and then publishes the dev image itself.

on:
  pull_request:
    branches: [dev, main]
  check_run:
    types: [completed]

permissions:
  contents: read

jobs:
  bot:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Move a security update to dev
        if: github.base_ref == 'main'
        run: |
          gh pr edit "$PR" --base dev
          gh workflow run ci.yml --ref "$HEAD_REF"

      - name: Merge when green, then publish
        run: |
          gh pr merge "$PR" --auto --squash
          for _ in $(seq 1 110); do
            sleep 30
            case "$(gh pr view "$PR" --json state --jq .state || true)" in
              MERGED) gh workflow run docker-publish.yml --ref dev; exit 0 ;;
              CLOSED) exit 0 ;;
            esac
            failed=$(gh pr checks "$PR" --required --json bucket \
              --jq 'any(.[]; .bucket == "fail")' || true)
            if [ "$failed" = true ]; then exit 0; fi
          done

  merge:
    if: >-
      github.event_name == 'check_run' &&
      github.event.check_run.app.slug == 'coderabbitai' &&
      github.event.check_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: automerge-${{ github.event.check_run.pull_requests[0].number }}
      cancel-in-progress: true
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.check_run.pull_requests[0].number }}
      SHA: ${{ github.event.check_run.head_sha }}
      CONCLUSION: ${{ github.event.check_run.conclusion }}
      SUMMARY: ${{ github.event.check_run.output.summary }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - run: |
          read -r base author head <<< "$(gh pr view "$PR" --json baseRefName,author,headRefOid \
            --jq '"\(.baseRefName) \(.author.login) \(.headRefOid)"')"
          [ "$base" = dev ] && [ "$head" = "$SHA" ] || exit 0
          [ "$author" = "$OWNER" ] || exit 0

          if [ "$CONCLUSION" != success ] || ! grep -q 'Review completed' <<< "$SUMMARY"; then
            # No real review of this commit: the pull request stays open.
            # CodeRabbit ignores commands from bots, draft toggles, and carries
            # its previous verdict forward on an empty commit, so a workflow
            # cannot ask again: say it once, for a person to ask.
            mark="Pas de revue CodeRabbit complète"
            gh pr view "$PR" --json comments --jq '.comments[].body' | grep -qF "$mark" && exit 0
            gh pr comment "$PR" --body "$mark pour ${SHA:0:7} : PR laissée ouverte."
            exit 0
          fi

          # Merge this reviewed commit only: a later push needs its own review.
          for _ in $(seq 1 110); do
            sleep 30
            read -r state head <<< "$(gh pr view "$PR" --json state,headRefOid \
              --jq '"\(.state) \(.headRefOid)"' || true)"
            [ "$state" = OPEN ] && [ "$head" = "$SHA" ] || exit 0
            checks=$(gh pr checks "$PR" --required --json bucket \
              --jq 'if any(.[]; .bucket == "fail") then "fail"
                    elif length > 0 and all(.[]; .bucket == "pass" or .bucket == "skipping")
                    then "pass"
                    else "wait" end' || true)
            case "$checks" in
              fail) exit 0 ;;
              pass)
                if gh pr merge "$PR" --squash --match-head-commit "$SHA"; then
                  gh workflow run docker-publish.yml --ref dev
                  branch=$(gh pr view "$PR" --json headRefName --jq .headRefName)
                  gh api -X DELETE "repos/$GH_REPO/git/refs/heads/$branch" || true
                  exit 0
                fi ;;
            esac
          done
